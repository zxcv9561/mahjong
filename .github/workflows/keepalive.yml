name: Supabase keepalive
on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Accept-Profile: mahjong")
          echo "status $code"
          [ "$code" -lt 500 ] || exit 1
      - uses: actions/checkout@v4
      - name: Monthly heartbeat commit
        run: |
          f=.github/keepalive.txt
          last=$(cat $f 2>/dev/null || echo 0)
          now=$(date +%s)
          if [ $((now - last)) -gt 2400000 ]; then
            echo $now > $f
            git config user.name "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git add $f && git commit -m "keepalive" && git push
          fi
